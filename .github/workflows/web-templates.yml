name: "@luzzle/web.templates"

on:
  push:
    branches:
      - main
    paths:
      - 'packages/web/templates/**'
      - 'packages/web/pieces/**'
      - 'packages/web/db/**'
      - 'packages/web/config/**'
      - 'apps/core/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-templates.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/web/templates/**'
      - 'packages/web/pieces/**'
      - 'packages/web/db/**'
      - 'packages/web/config/**'
      - 'apps/core/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-templates.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared type dependencies
        run: pnpm --filter @luzzle/core --filter @luzzle/web.config --filter @luzzle/web.db --filter @luzzle/web.pieces build

      - name: Build
        run: pnpm --filter @luzzle/web.templates build

      - name: Lint
        run: pnpm --filter @luzzle/web.templates lint
