name: "@luzzle/web.theme"

on:
  push:
    branches:
      - main
    paths:
      - 'packages/web/theme/**'
      - 'packages/web/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-theme.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web.config
        run: pnpm --filter @luzzle/web.config build

      - name: Build
        run: pnpm --filter @luzzle/web.theme build

      - name: Lint
        run: pnpm --filter @luzzle/web.theme lint

      - name: Test
        run: pnpm --filter @luzzle/web.theme test
