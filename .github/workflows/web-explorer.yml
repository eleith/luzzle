name: "@luzzle/web"

on:
  push:
    branches:
      - main
    tags:
      - 'web/v*'
    paths:
      - 'packages/web/explorer/**'
      - 'packages/web/config/**'
      - 'packages/web/theme/**'
      - 'packages/web/db/**'
      - 'packages/web/jobs/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-explorer.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web/explorer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        working-directory: .
        run: pnpm --filter @luzzle/core --filter @luzzle/web.config --filter @luzzle/web.theme --filter @luzzle/web.db --filter @luzzle/web.jobs build

      - name: Lint
        run: pnpm run lint

      - name: mock config
        run: touch config.yaml

      - name: mock .env
        run: touch .env

      - name: Check
        run: pnpm run check

  build-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Version
        if: github.ref_type == 'tag'
        run: |
          VERSION_FROM_PKG=$(node -p "require('./packages/web/explorer/package.json').version")
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION_FROM_TAG=${TAG_NAME#web/v}

          if [ "$VERSION_FROM_TAG" != "$VERSION_FROM_PKG" ]; then
            echo "Version mismatch: Tag version $VERSION_FROM_TAG does not match package.json version $VERSION_FROM_PKG"
            exit 1
          fi
          echo "Version $VERSION_FROM_PKG matches."

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eleith/luzzle-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=web/v(\d+),group=1
            type=match,pattern=web/v(\d+\.\d+),group=1
            type=match,pattern=web/v(\d+\.\d+\.\d+),group=1

      - name: Create dummy npmrc
        run: touch .npmrc

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/explorer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "npmrc=.npmrc"
