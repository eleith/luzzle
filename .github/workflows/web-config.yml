name: "@luzzle/web.config"

on:
  push:
    branches:
      - main
    tags:
      - 'web.config/v*'
    paths:
      - 'packages/web/config/**'
      - '.github/workflows/web-config.yml'

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci -w @luzzle/web.config

      - name: Build
        run: npm run build -w @luzzle/web.config

      - name: Lint
        run: npm run lint -w @luzzle/web.config

      - name: Test
        run: npm run test -w @luzzle/web.config

  publish:
    needs: check
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'web.config/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci -w @luzzle/web.config

      - name: Build
        run: npm run build -w @luzzle/web.config

      - name: Check Version
        run: |
          cd packages/web/config
          VERSION_FROM_PKG=$(npm pkg get version --workspaces=false | tr -d '"')
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION_FROM_TAG=${TAG_NAME#web.config/v}
          
          if [ "$VERSION_FROM_TAG" != "$VERSION_FROM_PKG" ]; then
            echo "Version mismatch: Tag version $VERSION_FROM_TAG does not match package.json version $VERSION_FROM_PKG"
            exit 1
          fi
          echo "Version $VERSION_FROM_PKG matches."

      - name: Publish
        run: npm publish -w @luzzle/web.config
