workspace:
  base: /workspace
  path: src

when:
  - event: push
    branch: main
    path:
      include:
        - ".woodpecker/.web-db.yml"
        - "packages/web/db/**"
        - "packages/web/config/**"
        - "packages/core/**"
        - "pnpm-lock.yaml"

steps:
  prepare:
    image: node:24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile

  build:
    image: node:24
    commands:
      - corepack enable
      - pnpm --filter @luzzle/core --filter @luzzle/web.config build
      - pnpm --filter @luzzle/web.db build

  test:
    image: node:24
    commands:
      - corepack enable
      - pnpm --filter @luzzle/web.db lint
      - pnpm --filter @luzzle/web.db test

  notify-success:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: success
      recipients_only: true
    when:
      - status: [success]

  notify-failure:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: failure
      recipients_only: true
    when:
      - status: [failure]
