workspace:
  base: /workspace
  path: src

when:
  - event: push
    branch: main
    path:
      include: [".woodpecker/.web-proxy.yml", "packages/web/proxy/**"]
  - event: pull_request
    path:
      include: [".woodpecker/.web-proxy.yml", "packages/web/proxy/**"]
  - event: tag
    ref: "refs/tags/@luzzle/web.proxy@*"

steps:
  extract-semver-tags:
    image: alpine/git:latest
    commands:
      - |
        VERSION_FULL="${CI_COMMIT_TAG#@luzzle/web.proxy@}"
        VERSION_MAJOR=$(echo "$VERSION_FULL" | cut -d. -f1)
        VERSION_MINOR=$(echo "$VERSION_FULL" | cut -d. -f2)

        SEMVER_FULL="$VERSION_FULL"
        SEMVER_MAJOR_MINOR="$VERSION_MAJOR.$VERSION_MINOR"
        SEMVER_MAJOR="$VERSION_MAJOR"

        echo "Extracted versions: $SEMVER_FULL, $SEMVER_MAJOR_MINOR, $SEMVER_MAJOR, "
        echo -e "$SEMVER_FULL\n$SEMVER_MAJOR\n$SEMVER_MAJOR_MINOR" >> .tags
        cat .tags
    when:
      - event: tag

  build-docker-main:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith.private/luzzle-web-proxy
      username: eleith
      dockerfile: packages/web/proxy/Dockerfile
      registry: https://git.eleith.com
      context: .
      password:
        from_secret: gitea_docker_registry
      tags:
        - latest
    when:
      - event: push
        branch: main

  build-docker-tag:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith.private/luzzle-web-proxy
      username: eleith
      dockerfile: packages/web/proxy/Dockerfile
      registry: https://git.eleith.com
      context: .
      password:
        from_secret: gitea_docker_registry
      tags_file: .tags
    when:
      - event: tag

  notify-success:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: success
      recipients_only: true
    when:
      - event: [push, tag]
        status: [success]
  notify-failure:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: failure
      recipients_only: true
    when:
      - event: [push, tag]
        status: [failure]
