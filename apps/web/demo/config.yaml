# yaml-language-server: $schema=../../../packages/web/config/src/lib/config/web.config.schema.json

url:
  app: http://localhost:8080

network:
  internal:
    explorer: http://luzzle-dev-web:5173
    worker: http://luzzle-dev-worker:9000

auth:
  enabled: true
  type: credentials
  secret: ${LUZZLE_AUTH_SECRET}
  credentials:
    username: admin
    password: ${LUZZLE_AUTH_PASSWORD}

ai:
  provider: google
  api_key: ${GOOGLE_API_KEY}

storage:
  root: ./archive

sync:
  config: ./rclone/rclone.conf
  archive:
    remote: archive
    path: ./remote
  cdn:
    remote: cdn
    path: ./cdn

paths:
  database: ./data/luzzle.sqlite

content:
  text:
    title: example luzzle site title
    description: an example luzzle site description

  component:
    root: ./content/components/pages/root.svelte
    '404': ./content/components/pages/404.svelte
    error: ./content/components/pages/error.svelte

pieces:
  - type: books
    components:
      icon: ./content/components/icons/book.svelte
      opengraph: ./content/components/opengraphs/book.svelte
      page: ./content/components/pages/book.svelte
    fields:
      title: title
      summary: description
      date_consumed: date_read
      tags: keywords
      media:
        - cover
  - type: films
    components:
      icon: ./content/components/icons/poster.svelte
      opengraph: ./content/components/opengraphs/poster.svelte
      page: ./content/components/pages/poster.svelte
    fields:
      title: title
      summary: summary
      date_consumed: date_viewed
      tags: keywords
      media:
        - poster
  - type: snippets
    components:
      icon: ./content/components/icons/snippet.svelte
      opengraph: ./content/components/opengraphs/snippet.svelte
      page: ./content/components/pages/snippet.svelte
    fields:
      title: title
      summary: summary
      date_consumed: date_added
      tags: keywords
      attachments:
        - files[*].file
  - type: words
    components:
      icon: ./content/components/icons/paper.svelte
      opengraph: ./content/components/opengraphs/paper.svelte
      page: ./content/components/pages/paper.svelte
    fields:
      title: title
      summary: summary
      date_consumed: date_published
      tags: keywords
      media:
        - representative_image
      attachments:
        - attachments

theme:
  globals:
    shadow-raised: 0px 3px 1px -2px rgba(0 0 0 / 20%), 0px 2px 2px 0px
      rgba(0 0 0 / 14%), 0px 1px 5px 0px rgba(0 0 0 / 12%)
    font-sans-name: '"Noto Sans"'
    font-mono-name: '"monaco, monospace"'
    font-sans-url: '"/fonts/noto-sans.woff2"'
    font-sans-weight: 300 600
    font-size-xxs: 0.7rem
    font-size-xs: 0.825rem
    font-size-small: 1rem
    font-size-normal: 1.25rem
    font-size-medium: 1.5rem
    font-size-large: 1.825rem
    font-size-xl: 2rem
    font-size-xxl: 3rem
    font-size-mobile-responsive-factor: 0.8
    font-size-root: 22
    font-weight-light: 300
    font-weight-normal: 400
    font-weight-medium: 500
    font-weight-semibold: 550
    font-weight-bold: 600
    radius-none: '0'
    radius-small: 0.25rem
    radius-medium: 0.375rem
    radius-large: 0.5rem
    radius-xl: 0.75rem
    radius-x2l: 1rem
    radius-x3l: 1.5rem
    radius-x4l: 2.5rem
    radius-full: 9999px
    breakpoint-phone: 640
    breakpoint-tablet: 768
    breakpoint-laptop: 1024
    breakpoint-desktop: 1280
    space-1: 0.25rem
    space-2: 0.5rem
    space-3: 0.75rem
    space-4: 1rem
    space-5: 1.25rem
    space-6: 1.5rem
    space-7: 1.75rem
    space-8: 2rem
    space-9: 2.25rem
    space-10: 2.5rem
    space-0-5: 0.125rem
    space-1-5: 0.375rem
    space-2-5: 0.625rem
    space-3-5: 0.875rem
  dark:
    color-primary: '#60a5fa'
    color-on-primary: '#1c1917'
    color-primary-container: '#1e40af'
    color-on-primary-container: '#dbeafe'
    color-secondary: '#fbbf24'
    color-on-secondary: '#1c1917'
    color-secondary-container: '#92400e'
    color-on-secondary-container: '#fef3c7'
    color-tertiary: '#2dd4bf'
    color-on-tertiary: '#1c1917'
    color-tertiary-container: '#115e59'
    color-on-tertiary-container: '#ccfbf1'
    color-error: '#f87171'
    color-on-error: '#1c1917'
    color-error-container: '#991b1b'
    color-on-error-container: '#fee2e2'
    color-surface: '#1c1917'
    color-surface-dim: '#0c0a09'
    color-surface-bright: '#292524'
    color-surface-inverse: '#fafaf9'
    color-on-surface: '#fafaf9'
    color-on-surface-variant: '#a8a29e'
    color-on-surface-inverse: '#1c1917'
    color-surface-container-lowest: '#0c0a09'
    color-surface-container-low: '#1c1917'
    color-surface-container: '#292524'
    color-surface-container-high: '#44403c'
    color-surface-container-highest: '#57534e'
    color-shadow: hsla(0, 0%, 0%, 0.6)
    color-outline: '#a8a29e'
    color-outline-variant: '#44403c'
  light:
    color-primary: '#3b82f6'
    color-on-primary: '#ffffff'
    color-primary-container: '#dbeafe'
    color-on-primary-container: '#1e40af'
    color-secondary: '#d97706'
    color-on-secondary: '#ffffff'
    color-secondary-container: '#fef3c7'
    color-on-secondary-container: '#92400e'
    color-tertiary: '#0d9488'
    color-on-tertiary: '#ffffff'
    color-tertiary-container: '#ccfbf1'
    color-on-tertiary-container: '#115e59'
    color-error: '#dc2626'
    color-on-error: '#ffffff'
    color-error-container: '#fee2e2'
    color-on-error-container: '#991b1b'
    color-surface: '#fafaf9'
    color-surface-dim: '#f5f5f4'
    color-surface-bright: '#ffffff'
    color-surface-inverse: '#292524'
    color-on-surface: '#292524'
    color-on-surface-variant: '#57534e'
    color-on-surface-inverse: '#fafaf9'
    color-surface-container-lowest: '#ffffff'
    color-surface-container-low: '#f5f5f4'
    color-surface-container: '#e7e5e4'
    color-surface-container-high: '#d6d3d1'
    color-surface-container-highest: '#a8a29e'
    color-shadow: hsla(0, 0%, 0%, 0.2)
    color-outline: '#78716c'
    color-outline-variant: '#d6d3d1'
  markdown:
    code:
      light: 'github-light-default'
      dark: 'github-dark-default'
