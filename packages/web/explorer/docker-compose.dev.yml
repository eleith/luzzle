services:
  luzzle-dev-web:
    build:
      dockerfile: Dockerfile.dev
      context: .
      additional_contexts:
        core: ../../core
        utils: ../utils
        config: ../config
        tools: ../tools
    container_name: luzzle-dev-web
    user: '${UID:-1000}:${GID:-1000}'
    env_file: .env
    environment:
      - LUZZLE_DEV=true
    ports:
      - '5173:5173'
    volumes:
      - ./demo/assets/pieces:/app/assets/pieces
      - ./demo/config.yaml:/app/config.yaml
      - ./demo/data:/app/data
      - ./demo/content:/app/content
      - ./demo/archive:/app/archive
      - ./demo/cdn:/app/cdn
      - ./src:/app/src
      - ./static:/app/static
      - ./scripts:/app/scripts
      - ./tsconfig.json:/app/tsconfig.json
      - ./svelte.config.js:/app/svelte.config.js
      - ./vite.config.ts:/app/vite.config.ts
    networks:
      - luzzle
    depends_on:
      # - luzzle-dev-builder
      - luzzle-dev-worker
      - luzzle-dev-lsp

#  luzzle-dev-builder:
#    build:
#      dockerfile: Dockerfile.dev
#      context: ../builder
#      additional_contexts:
#        core: ../../core
#        utils: ../utils
#        config: ../config
#        tools: ../tools
#    container_name: luzzle-dev-builder
#    user: '${UID:-1000}:${GID:-1000}'
#    ports:
#      - '9000:9000'
#    env_file: .env
#    networks:
#      - luzzle
#    volumes:
#      - ./demo/config.yaml:/app/config.yaml
#      - ./demo/assets:/app/assets
#      - ./demo/data:/app/data
#      - ./demo/archive:/app/archive
#      - ../builder/server.js:/app/server.js
#      - ../builder/scripts:/app/scripts
#      - ./demo/rclone:/app/rclone
#      - ./demo/remote:/app/remote

  luzzle-dev-worker:
    build:
      dockerfile: Dockerfile.dev
      context: ../worker
      additional_contexts:
        core: ../../core
        config: ../config
    container_name: luzzle-dev-worker
    user: '${UID:-1000}:${GID:-1000}'
    env_file: .env
    networks:
      - luzzle
    volumes:
      - ./demo/config.yaml:/app/config.yaml
      - ./demo/assets:/app/assets
      - ./demo/data:/app/data
      - ./demo/archive:/app/archive
      - ./demo/rclone:/app/rclone
      - ./demo/remote:/app/remote
      - ./demo/cdn:/app/cdn
      - ./nginx/cache:/app/nginx
      - ../worker/src:/app/src
      - ../worker/scripts:/app/scripts
      - ../worker/tsconfig.json:/app/tsconfig.json
      - ../worker/tsconfig.build.json:/app/tsconfig.build.json
      - ../worker/vite.config.ts:/app/vite.config.ts

  luzzle-dev-lsp:
    build:
      dockerfile: Dockerfile.dev
      context: ../lsp
      additional_contexts:
        lsp: ../../lsp
    container_name: luzzle-dev-lsp
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      - LUZZLE_DEV=true
    ports:
      - '9001:9001'
    networks:
      - luzzle
    volumes:
      - ./demo/archive:/app/archive
      - ../lsp/server.js:/app/server.js
      - ../lsp/luzzle-lsp.js:/app/luzzle-lsp.js
      - ../lsp/markdownlint-lsp.js:/app/markdownlint-lsp.js

  luzzle-dev-proxy:
    build:
      dockerfile: Dockerfile.dev
      context: ../proxy
    container_name: luzzle-dev-proxy
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '8080:8080'
    networks:
      - luzzle
    volumes:
      - ./nginx/cache:/tmp/cache
      - ./nginx/logs:/tmp/logs
    depends_on:
      - luzzle-dev-web
      - luzzle-dev-lsp

networks:
  luzzle:
    driver: bridge
