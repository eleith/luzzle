services:
  luzzle-dev-web:
    build:
      context: ../../..
      dockerfile: packages/web/explorer/Dockerfile
      target: dev
      secrets:
        - npmrc
    container_name: luzzle-dev-web
    user: '${UID:-1000}:${GID:-1000}'
    env_file: .env
    environment:
      - LUZZLE_DEV=true
    ports:
      - '5173:5173'
    volumes:
      - ./demo/assets:/m/packages/web/explorer/assets
      - ./demo/config.yaml:/m/packages/web/explorer/config.yaml
      - ./demo/data:/m/packages/web/explorer/data
      - ./demo/content:/m/packages/web/explorer/content
      - ./demo/archive:/m/packages/web/explorer/archive
      - ./demo/cdn:/m/packages/web/explorer/cdn
      - ./src:/m/packages/web/explorer/src
      - ./static:/m/packages/web/explorer/static
      - ./scripts:/m/packages/web/explorer/scripts
      - ./tsconfig.json:/m/packages/web/explorer/tsconfig.json
      - ./svelte.config.js:/m/packages/web/explorer/svelte.config.js
      - ./vite.config.ts:/m/packages/web/explorer/vite.config.ts
    networks:
      - luzzle
    depends_on:
      luzzle-dev-worker:
        condition: service_healthy
      luzzle-dev-lsp:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5173/api/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"'
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  luzzle-dev-worker:
    build:
      context: ../../..
      dockerfile: packages/web/worker/Dockerfile
      target: dev
      secrets:
        - npmrc
    container_name: luzzle-dev-worker
    user: '${UID:-1000}:${GID:-1000}'
    env_file: .env
    environment:
      - LUZZLE_DEV=true
    networks:
      - luzzle
    volumes:
      - ./demo/config.yaml:/m/packages/web/worker/config.yaml
      - ./demo/assets:/m/packages/web/worker/assets
      - ./demo/data:/m/packages/web/worker/data
      - ./demo/archive:/m/packages/web/worker/archive
      - ./demo/rclone:/m/packages/web/worker/rclone
      - ./demo/remote:/m/packages/web/worker/remote
      - ./demo/cdn:/m/packages/web/worker/cdn
      - ./demo/content:/m/packages/web/worker/content
      - ./nginx/cache:/m/packages/web/worker/nginx
      - ../worker/src:/m/packages/web/worker/src
      - ./static:/m/packages/web/worker/static
      - ../worker/scripts:/m/packages/web/worker/scripts
      - ../worker/tsconfig.json:/m/packages/web/worker/tsconfig.json
      - ../worker/tsconfig.build.json:/m/packages/web/worker/tsconfig.build.json
      - ../worker/vite.config.ts:/m/packages/web/worker/vite.config.ts
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:9000/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"'
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  luzzle-dev-lsp:
    build:
      context: ../../..
      dockerfile: packages/web/lsp/Dockerfile
      target: dev
      secrets:
        - npmrc
    container_name: luzzle-dev-lsp
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      - LUZZLE_DEV=true
    ports:
      - '9001:9001'
    networks:
      - luzzle
    volumes:
      - ./demo/archive:/m/packages/web/lsp/archive
      - ../lsp/server.js:/m/packages/web/lsp/server.js
      - ../lsp/luzzle-lsp.js:/m/packages/web/lsp/luzzle-lsp.js
      - ../lsp/markdownlint-lsp.js:/m/packages/web/lsp/markdownlint-lsp.js
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:9001/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"'
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  luzzle-dev-proxy:
    build:
      context: ../../..
      dockerfile: packages/web/proxy/Dockerfile
      target: dev
    container_name: luzzle-dev-proxy
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '8080:8080'
    networks:
      - luzzle
    volumes:
      - ./nginx/cache:/tmp/cache
      - ./nginx/logs:/tmp/logs
    depends_on:
      luzzle-dev-web:
        condition: service_healthy
      luzzle-dev-lsp:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

secrets:
  npmrc:
    file: $HOME/.npmrc

networks:
  luzzle:
    driver: bridge
