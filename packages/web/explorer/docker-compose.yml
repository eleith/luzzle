services:
  luzzle-web:
    build:
      dockerfile: Dockerfile
      # dockerfile: Dockerfile.dev
      secrets:
        - npmrc
      context: .
    container_name: luzzle-web
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    ports:
      - "3000:3000"
      # - "5173:5173"
    volumes:
      - ./assets/pieces:/app/assets/pieces
      - ./assets/build:/app/assets/build
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./content:/app/content
      - ./archive:/app/archive
      # - ./src:/app/src
      # - ./static:/app/static
      # - ./scripts:/app/scripts
      # - ./svelte.config.js:/app/svelte.config.js
      # - ./vite.config.ts:/app/vite.config.ts
      # - ./tsconfig.json:/app/tsconfig.json
    networks:
      - luzzle
    depends_on:
      - luzzle-builder

  luzzle-builder:
    build:
      dockerfile: ../builder/Dockerfile
      secrets:
        - npmrc
      context: ../builder
    container_name: luzzle-builder
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - '9000:9000'
    env_file: .env
    networks:
      - luzzle
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./assets/pieces:/app/assets
      - ./data:/app/data
      - ./archive:/app/archive

  luzzle-proxy:
    build:
      dockerfile: ../proxy/Dockerfile
      secrets:
        - npmrc
      context: ../proxy
    container_name: luzzle-proxy
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - LUZZLE_EXPLORER_HOST=luzzle-web
      - LUZZLE_EXPLORER_PORT=3000
      # - LUZZLE_EXPLORER_PORT=5173
    ports:
      - "8080:8080"
    networks:
      - luzzle
    volumes:
      - ./nginx:/tmp/cache
    depends_on:
      - luzzle-web

secrets:
  npmrc:
    file: $HOME/.npmrc

networks:
  luzzle:
    driver: bridge
