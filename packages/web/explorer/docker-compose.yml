services:
  luzzle-web:
    build:
      dockerfile: Dockerfile
      secrets:
        - npmrc
      context: .
    container_name: luzzle-web
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./demo/assets/pieces:/app/assets/pieces
      - ./demo/config.yaml:/app/config.yaml
      - ./demo/data:/app/data
      - ./demo/content:/app/content
      - ./demo/archive:/app/archive
    networks:
      - luzzle
    depends_on:
      - luzzle-worker

  luzzle-worker:
    build:
      dockerfile: ../worker/Dockerfile
      secrets:
        - npmrc
      context: ../worker
    container_name: luzzle-worker
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    networks:
      - luzzle
    volumes:
      - ./demo/config.yaml:/app/config.yaml
      - ./demo/assets:/app/assets
      - ./demo/data:/app/data
      - ./demo/archive:/app/archive
      - ./demo/rclone:/app/rclone
      - ./demo/remote:/app/remote
      - ./demo/cdn:/app/cdn
      - ./nginx/cache:/app/nginx

  luzzle-lsp:
    build:
      dockerfile: ../lsp/Dockerfile
      secrets:
        - npmrc
      context: ../lsp
    container_name: luzzle-lsp
    user: '${UID:-1000}:${GID:-1000}'
    networks:
      - luzzle
    ports:
      - '9001:9001'
    volumes:
      - ./demo/archive:/app/archive

  luzzle-proxy:
    build:
      dockerfile: ../proxy/Dockerfile
      secrets:
        - npmrc
      context: ../proxy
    container_name: luzzle-lsp
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - "8080:8080"
    networks:
      - luzzle
    volumes:
      - ./nginx/cache:/tmp/cache
      - ./nginx/logs:/tmp/logs
    depends_on:
      - luzzle-web

secrets:
  npmrc:
    file: $HOME/.npmrc

networks:
  luzzle:
    driver: bridge
